<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprachigo — Support</title>
<style>
  :root { color-scheme: light dark; --bg:#fffaf5; --fg:#1a1a1a; --muted:#5a5a5a; --accent:#00b894; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14100c; --fg:#f2ece2; --muted:#b5aa9a; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  .wrap { max-width:640px; margin:0 auto; padding:56px 20px 80px; }
  h1 { font-size:26px; margin:0 0 8px; }
  p { font-size:16px; }
  a { color:var(--accent); }
  .card { background:rgba(0,184,148,0.08); border:1px solid rgba(0,184,148,0.25); border-radius:14px; padding:20px 22px; margin:24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sprachigo — Support</h1>
  <p>Need help with Sprachigo, found a bug, or have a question or suggestion?</p>
  <div class="card">
    <p style="margin:0">Email us at <a href="mailto:patikokoapp@gmail.com">patikokoapp@gmail.com</a> and we'll get back to you as soon as we can.</p>
  </div>
  <p>See also our <a href="./">Privacy Policy</a>.</p>
</div>
</body>
</html>
